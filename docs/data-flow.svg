<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 756.8" width="1000" height="756.8" role="img" aria-label="Data flow, table by table: six listing sites (realestate.eg, Property Finder Egypt, Dubizzle Egypt and Nawy read by the weekly Airflow DAG, Bayut Egypt and Aqarmap by a browser run before it) are kept as pages on disk and logged in bronze.fetch_log (1,804 pages). load_silver parses them into silver.listing (5,757 rows), silver.price_observation (5,757), silver.quarantine (41) and silver.run_log (36), and loads the areas from config/client.yaml (6) and our units from our_units.csv (60). build_gold builds a star of two facts, fact_listing_price (5,757 rows, quarantined prices left out) and fact_our_unit (60), five dimensions and six views, among them pooled_listing_price (5,619 rows). Power BI reads gold into three pages, the report task prints the weekly summary and the notebook computes every README number.">
