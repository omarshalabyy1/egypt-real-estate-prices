<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 534" width="1000" height="534" role="img" aria-label="Price gap by area: one strip per area (New Cairo, New Capital, Sheikh Zayed, 6th of October, North Coast, Mostakbal City). On each strip a band shows the middle half of competing listings by asking price per square metre, a tick shows the area median, and dots show our units. The gap between our units and the area median is written beside each strip, and the share of competing listings cheaper than ours at its right end.">
  <!-- Positions are illustrative until the notebook redraws this file from the gold layer. Every number is a tspan with id="nb-KEY"; the notebook fills them. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#16233B"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
    .title { font-size: 21px; font-weight: 700; fill: #FFFFFF; }
    .sub { font-size: 13.5px; fill: #CBD5E1; }
    .head { font-size: 12.5px; font-weight: 600; fill: #94A3B8; }
    .area { font-size: 15px; font-weight: 700; fill: #FFFFFF; }
    .cap { font-size: 12.5px; fill: #94A3B8; }
    .val { font-size: 15px; font-weight: 700; fill: #FFFFFF; }
    .track { stroke: #334155; stroke-width: 2; }
    .band { fill: #CBD5E1; fill-opacity: 0.22; }
    .median { stroke: #E2E8F0; stroke-width: 2.5; }
    .ours { fill: #F59E0B; stroke: #0B1220; stroke-width: 2; }
  </style>

  <rect width="1000" height="534" rx="22" fill="url(#bg)"/>
  <text x="40" y="50" class="title">Where our units sit against the market</text>
  <text x="40" y="74" class="sub">Asking price per m² in EGP, latest run week. One strip per area, all on one scale.</text>

  <text x="40" y="122" class="head">Area</text>
  <text x="230" y="122" class="head"><tspan id="nb-scale_min_m2">…</tspan> EGP per m²</text>
  <text x="690" y="122" class="head" text-anchor="end"><tspan id="nb-scale_max_m2">…</tspan> EGP per m²</text>
  <text x="760" y="122" class="head" text-anchor="middle">Gap</text>
  <text x="960" y="114" class="head" text-anchor="end">Listings cheaper</text>
  <text x="960" y="130" class="head" text-anchor="end">than ours</text>
  <line x1="40" y1="142" x2="960" y2="142" stroke="#334155" stroke-width="1.5"/>

  <!-- New Cairo -->
  <text x="40" y="174" class="area">New Cairo</text>
  <text x="40" y="192" class="cap">median <tspan id="nb-median_m2_new_cairo">…</tspan></text>
  <line x1="230" y1="176" x2="690" y2="176" class="track"/>
  <rect x="250" y="167" width="150" height="18" rx="4" class="band"/>
  <line x1="320" y1="162" x2="320" y2="190" class="median"/>
  <circle cx="370" cy="176" r="7" class="ours"/>
  <circle cx="395" cy="176" r="7" class="ours"/>
  <text x="760" y="181" class="val" text-anchor="middle"><tspan id="nb-gap_pct_new_cairo">…</tspan>%</text>
  <text x="960" y="181" class="val" text-anchor="end"><tspan id="nb-share_cheaper_new_cairo">…</tspan>%</text>
  <!-- New Capital -->
  <text x="40" y="226" class="area">New Capital</text>
  <text x="40" y="244" class="cap">median <tspan id="nb-median_m2_new_capital">…</tspan></text>
  <line x1="230" y1="228" x2="690" y2="228" class="track"/>
  <rect x="300" y="219" width="170" height="18" rx="4" class="band"/>
  <line x1="380" y1="214" x2="380" y2="242" class="median"/>
  <circle cx="350" cy="228" r="7" class="ours"/>
  <text x="760" y="233" class="val" text-anchor="middle"><tspan id="nb-gap_pct_new_capital">…</tspan>%</text>
  <text x="960" y="233" class="val" text-anchor="end"><tspan id="nb-share_cheaper_new_capital">…</tspan>%</text>
  <!-- Sheikh Zayed -->
  <text x="40" y="278" class="area">Sheikh Zayed</text>
  <text x="40" y="296" class="cap">median <tspan id="nb-median_m2_sheikh_zayed">…</tspan></text>
  <line x1="230" y1="280" x2="690" y2="280" class="track"/>
  <rect x="230" y="271" width="130" height="18" rx="4" class="band"/>
  <line x1="290" y1="266" x2="290" y2="294" class="median"/>
  <circle cx="400" cy="280" r="7" class="ours"/>
  <circle cx="430" cy="280" r="7" class="ours"/>
  <text x="760" y="285" class="val" text-anchor="middle"><tspan id="nb-gap_pct_sheikh_zayed">…</tspan>%</text>
  <text x="960" y="285" class="val" text-anchor="end"><tspan id="nb-share_cheaper_sheikh_zayed">…</tspan>%</text>
  <!-- 6th of October -->
  <text x="40" y="330" class="area">6th of October</text>
  <text x="40" y="348" class="cap">median <tspan id="nb-median_m2_sixth_october">…</tspan></text>
  <line x1="230" y1="332" x2="690" y2="332" class="track"/>
  <rect x="245" y="323" width="115" height="18" rx="4" class="band"/>
  <line x1="300" y1="318" x2="300" y2="346" class="median"/>
  <circle cx="285" cy="332" r="7" class="ours"/>
  <text x="760" y="337" class="val" text-anchor="middle"><tspan id="nb-gap_pct_sixth_october">…</tspan>%</text>
  <text x="960" y="337" class="val" text-anchor="end"><tspan id="nb-share_cheaper_sixth_october">…</tspan>%</text>
  <!-- North Coast -->
  <text x="40" y="382" class="area">North Coast</text>
  <text x="40" y="400" class="cap">median <tspan id="nb-median_m2_north_coast">…</tspan></text>
  <line x1="230" y1="384" x2="690" y2="384" class="track"/>
  <rect x="380" y="375" width="180" height="18" rx="4" class="band"/>
  <line x1="470" y1="370" x2="470" y2="398" class="median"/>
  <circle cx="500" cy="384" r="7" class="ours"/>
  <circle cx="540" cy="384" r="7" class="ours"/>
  <text x="760" y="389" class="val" text-anchor="middle"><tspan id="nb-gap_pct_north_coast">…</tspan>%</text>
  <text x="960" y="389" class="val" text-anchor="end"><tspan id="nb-share_cheaper_north_coast">…</tspan>%</text>
  <!-- Mostakbal City -->
  <text x="40" y="434" class="area">Mostakbal City</text>
  <text x="40" y="452" class="cap">median <tspan id="nb-median_m2_mostakbal_city">…</tspan></text>
  <line x1="230" y1="436" x2="690" y2="436" class="track"/>
  <rect x="260" y="427" width="120" height="18" rx="4" class="band"/>
  <line x1="310" y1="422" x2="310" y2="450" class="median"/>
  <circle cx="330" cy="436" r="7" class="ours"/>
  <text x="760" y="441" class="val" text-anchor="middle"><tspan id="nb-gap_pct_mostakbal_city">…</tspan>%</text>
  <text x="960" y="441" class="val" text-anchor="end"><tspan id="nb-share_cheaper_mostakbal_city">…</tspan>%</text>

  <!-- legend -->
  <line x1="40" y1="482" x2="960" y2="482" stroke="#334155" stroke-width="1.5"/>
  <rect x="40" y="496" width="34" height="16" rx="4" class="band"/>
  <text x="82" y="509" class="cap">middle half of competing listings</text>
  <line x1="300" y1="492" x2="300" y2="516" class="median"/>
  <text x="312" y="509" class="cap">area median</text>
  <circle cx="420" cy="504" r="7" class="ours"/>
  <text x="434" y="509" class="cap">our unit</text>
  <text x="520" y="509" class="cap">Gap: our units' median price per m² against the area median.</text>
</svg>
