<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 150" width="1000" height="150" role="img" aria-label="Price every unit against its market, every week.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#10213A"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
    .wave { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 2 10; animation: flow 6s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -120; } }
    .pulse { animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  </style>

  <rect width="1000" height="150" rx="22" fill="url(#bg)"/>
  <path class="wave" stroke="#2DD4BF" stroke-opacity="0.6" d="M30 95 C 160 40, 300 120, 430 70 M570 70 C 700 120, 840 40, 970 75"/>
  <path class="wave" stroke="#A78BFA" stroke-opacity="0.45" style="animation-duration:9s" d="M30 112 C 200 80, 330 130, 440 95 M560 95 C 680 130, 820 80, 970 100"/>
  <circle cx="175" cy="70" r="4" fill="#E2E8F0"/>
  <circle cx="365" cy="88" r="4" fill="#E2E8F0"/>
  <circle cx="660" cy="92" r="4" fill="#E2E8F0"/>
  <circle cx="860" cy="66" r="4" fill="#E2E8F0"/>
  <circle cx="500" cy="62" r="22" fill="none" stroke="#5EEAD4" stroke-opacity="0.6" stroke-width="1.6"/>
  <circle cx="500" cy="62" r="7" fill="#4ADE80" class="pulse"/>

  <text x="500" y="130" font-size="14" fill="#CBD5E1" text-anchor="middle">Price every unit against its market, every week.</text>
</svg>
