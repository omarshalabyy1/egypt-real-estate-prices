<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 794" width="1000" height="794" role="img" aria-label="Star schema with two facts. fact_listing_price (5,757 rows, one per site, listing and run week, key site_key plus listing_id plus week_key) joins dim_site (6 rows), dim_week (1), dim_area (6), dim_compound (1,291) and dim_property_type (11), many to one. fact_our_unit (60 rows, one per unit of ours) shares dim_area, dim_compound and dim_property_type, so one slicer filters the market and our units the same way. Power BI loads the listing fact through gold.pooled_listing_price (5,619 rows) and five views beside it.">
