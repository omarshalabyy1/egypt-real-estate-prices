<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" width="1200" height="290" role="img" aria-label="How it works: 01 Read, listing pages of six areas, one request every few seconds, inside the site's robots.txt; 02 Check, every row checked for price, size and area, failures go to quarantine; 03 Store, every price per square metre kept with its date, never overwritten; 04 Compare, our units against competitor listings in the same area, by compound and developer; 05 Report, Power BI gaps by area, compound and developer, and who cut prices.">
  <style>
    text { font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
    .title { font-size: 21px; font-weight: 700; fill: #FFFFFF; }
    .sub { font-size: 13.5px; fill: #CBD5E1; }
    .num { font-size: 13px; font-weight: 700; fill: #0B1220; }
    .step { font-size: 16px; font-weight: 700; fill: #FFFFFF; }
    .desc { font-size: 12.5px; fill: #94A3B8; }
    .box { fill: #FFFFFF; fill-opacity: 0.04; stroke: #334155; }
    .link { fill: none; stroke: #F59E0B; stroke-width: 2; stroke-dasharray: 4 6; animation: flow 1.6s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -20; } }
  </style>

  <rect width="1200" height="290" rx="22" fill="#0B1220"/>
  <text x="40" y="52" class="title">How it works</text>
  <text x="40" y="76" class="sub">One Airflow run a week. Prices are only ever added, so every cut can be found later.</text>

  <path class="link" d="M244 175h25"/>
  <path class="link" d="M473 175h25"/>
  <path class="link" d="M702 175h25"/>
  <path class="link" d="M931 175h25"/>

  <rect x="40" y="105" width="204" height="140" rx="14" class="box"/>
  <circle cx="70" cy="135" r="15" fill="#F59E0B"/>
  <text x="70" y="140" class="num" text-anchor="middle">01</text>
  <text x="94" y="141" class="step">Read</text>
  <text x="56" y="178" class="desc">Listing pages of six areas,</text>
  <text x="56" y="197" class="desc">one request every few</text>
  <text x="56" y="216" class="desc">seconds, inside robots.txt</text>

  <rect x="269" y="105" width="204" height="140" rx="14" class="box"/>
  <circle cx="299" cy="135" r="15" fill="#F59E0B"/>
  <text x="299" y="140" class="num" text-anchor="middle">02</text>
  <text x="323" y="141" class="step">Check</text>
  <text x="285" y="178" class="desc">Price, size and area on</text>
  <text x="285" y="197" class="desc">every row; failures go to</text>
  <text x="285" y="216" class="desc">quarantine, not dropped</text>

  <rect x="498" y="105" width="204" height="140" rx="14" class="box"/>
  <circle cx="528" cy="135" r="15" fill="#F59E0B"/>
  <text x="528" y="140" class="num" text-anchor="middle">03</text>
  <text x="552" y="141" class="step">Store</text>
  <text x="514" y="178" class="desc">Every price per m² kept</text>
  <text x="514" y="197" class="desc">with its date, never</text>
  <text x="514" y="216" class="desc">overwritten</text>

  <rect x="727" y="105" width="204" height="140" rx="14" class="box"/>
  <circle cx="757" cy="135" r="15" fill="#F59E0B"/>
  <text x="757" y="140" class="num" text-anchor="middle">04</text>
  <text x="781" y="141" class="step">Compare</text>
  <text x="743" y="178" class="desc">Our units against rival</text>
  <text x="743" y="197" class="desc">listings in the same area,</text>
  <text x="743" y="216" class="desc">by compound and developer</text>

  <rect x="956" y="105" width="204" height="140" rx="14" class="box"/>
  <circle cx="986" cy="135" r="15" fill="#F59E0B"/>
  <text x="986" y="140" class="num" text-anchor="middle">05</text>
  <text x="1010" y="141" class="step">Report</text>
  <text x="972" y="178" class="desc">Power BI: gaps by area,</text>
  <text x="972" y="197" class="desc">compound and developer;</text>
  <text x="972" y="216" class="desc">who cut prices</text>
</svg>
